version: "3.8"

services:
  ghostshell:
    build: .
    container_name: ghostshell_app
    # Montăm directorul curent în container pentru a edita codul live fără rebuild
    volumes:
      - .:/app
    # Mod privilegiat necesar pentru manipulare procese și raw sockets
    privileged: true
    
    # Expose ports for Bind Shell and Reverse Shell testing
    ports:
      # - "4444:4444" # REMOVED: Conflict with Reverse Shell Listener on Host
      - "5555:5555"   # KEEP: Required for Bind Shell (Host -> Container)

    # Network mode host is problematic on Windows/Mac, using bridge with ports instead
    # network_mode: "host"
